<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space details · ReVive Dortmund</title>
<style>
:root{--red:#ef3455;--ink:#20232a;--muted:#737982;--line:#e9ebee}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#f7f7f8}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:850;letter-spacing:-.6px}.brand b{color:var(--red)}
.demo{font-size:11px;color:#9e2240;background:#ffe9ed;padding:8px 11px;border-radius:100px;font-weight:800}
main{max-width:1080px;margin:24px auto;padding:0 18px 50px}
.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
button{font:inherit;cursor:pointer}.back{border:1px solid #d9dfe5;background:white;border-radius:10px;padding:10px 13px;font-weight:750}
h1{font-size:30px;letter-spacing:-.6px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 18px;line-height:1.5}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:180px;gap:8px;border-radius:18px;overflow:hidden;margin:18px 0 24px}
.gallery img{width:100%;height:100%;object-fit:cover;background:#e9ebee}.gallery img:first-child{grid-row:span 2}
.content{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:24px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{padding:11px;border:1px solid var(--line);border-radius:10px;min-width:0}
.key{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;margin-bottom:5px}
.val{overflow-wrap:anywhere;line-height:1.6;white-space:pre-line}
.tag{display:inline-block;background:#fff0f3;color:#a5223e;padding:5px 9px;border-radius:8px;margin:3px;font-size:12px;font-weight:700}
.price{font-size:23px;font-weight:850;color:#d31f42}.muted{color:var(--muted)}
.review{padding:13px 0;border-bottom:1px solid var(--line)}.review:last-child{border-bottom:0}
.stars{color:#e3a008;letter-spacing:2px;font-size:18px;white-space:nowrap}.review-comment{margin-top:5px;line-height:1.5;overflow-wrap:anywhere}
label{display:block;font-weight:750;font-size:12px;margin:12px 0 6px}
select,textarea{width:100%;border:1px solid #d9dfe5;border-radius:10px;padding:11px;background:white;font:inherit}
textarea{resize:vertical;min-height:85px}.submit{margin-top:12px;border:0;border-radius:10px;background:var(--red);color:white;padding:12px 16px;font-weight:800;width:100%}
.status{font-size:12px;line-height:1.5;margin-top:10px}.error{color:#ad1a38}.success{color:#256349}
.raw{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
@media(max-width:720px){.content{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr;grid-auto-rows:130px}.gallery img:first-child{grid-row:span 2}h1{font-size:24px}.grid{grid-template-columns:1fr}header{padding:0 12px}.demo{font-size:9px}}
</style>
<script src="/frontend/events-detail.js" defer></script>

<body>
<header><div class="brand">ReVive <b>Dortmund</b></div><span class="demo">SYNTHETIC DATA · HACKATHON DEMO</span></header>
<main>
  <div class="topline"><button class="back" id="back">← Back to spaces</button><span class="muted">Space details</span></div>
  <div id="status" class="muted">Loading listing details…</div>
  <div id="details" hidden>
    <h1 id="title"></h1><p id="subtitle" class="sub"></p>
    <div id="gallery" class="gallery"></div>
    <div class="content">
      <div>
        <section class="panel"><h2>About this space</h2><div id="summary" class="val"></div></section>
        <section class="panel"><h2>All listing information</h2><div id="all-fields" class="grid"></div></section>
      </div>
      <div>
        <section class="panel"><div id="price" class="price"></div><div id="rating-summary" class="muted" style="margin-top:7px"></div></section>
        <section class="panel"><h2>Reviews</h2><div id="reviews"></div>
          <h3 style="margin-top:20px">Add your review</h3>
          <form id="review-form">
            <label for="stars">Your rating</label>
            <select id="stars" required>
              <option value="5">★★★★★ — 5 stars</option>
              <option value="4">★★★★☆ — 4 stars</option>
              <option value="3">★★★☆☆ — 3 stars</option>
              <option value="2">★★☆☆☆ — 2 stars</option>
              <option value="1">★☆☆☆☆ — 1 star</option>
            </select>
            <label for="comment">Comment (optional)</label>
            <textarea id="comment" maxlength="2000" placeholder="Share your experience, or leave this blank"></textarea>
            <button class="submit" id="submit-review" type="submit">Submit review</button>
            <div id="review-status" class="status" role="status" aria-live="polite"></div>
          </form>
        </section>
      </div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const escapeHtml = x => String(x ?? '').replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const money = x => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(x);
const spaceId = new URLSearchParams(location.search).get('id');
let listing = null;
function starsHtml(n){const v=Math.max(0,Math.min(5,Math.round(Number(n)||0)));return `<span class="stars" aria-label="${v} out of 5 stars">${'★'.repeat(v)}${'☆'.repeat(5-v)}</span>`;}
function formatLabel(key){
  return String(key||'')
    .replace(/\[\d+\]/g,'')
    .replace(/[_-]+/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .replace(/\b\w/g,c=>c.toUpperCase());
}
function isMeaningful(value){
  if(value===null || value===undefined) return false;
  if(typeof value==='number') return Number.isFinite(value) && value!==0;
  if(typeof value==='string'){
    const v=value.trim().toLowerCase();
    if(!v || ['null','undefined','nan','n/a','none','not specified','0','0.0','0.00','0 €','€0'].includes(v)) return false;
    return true;
  }
  if(Array.isArray(value)) return value.some(isMeaningful);
  if(typeof value==='object') return Object.values(value).some(isMeaningful);
  return true;
}
function displayValue(value){
  if(!isMeaningful(value)) return '';
  if(typeof value==='boolean') return value?'Yes':'No';
  if(Array.isArray(value)) return value.map(displayValue).filter(Boolean).join(', ');
  if(typeof value==='object') return Object.entries(value)
    .filter(([k,v])=>isMeaningful(v))
    .map(([k,v])=>`${formatLabel(k)}: ${displayValue(v)}`).join(' · ');
  return String(value);
}
function addField(container,key,value){
  if(!isMeaningful(value)) return;
  const shown=displayValue(value);
  if(!shown) return;
  const div=document.createElement('div');div.className='field';
  div.innerHTML=`<div class="key">${escapeHtml(formatLabel(key))}</div><div class="val">${escapeHtml(shown)}</div>`;
  container.appendChild(div);
}
function getAddress(){
  const a=listing.address;
  if(typeof a==='string') return a;
  if(a && typeof a==='object') return [a.exact_address,a.street,a.district,a.postcode].filter(Boolean).join(', ');
  return '';
}
function getGroupedValue(obj, keys){
  for(const key of keys){
    const value=obj?.[key];
    if(value!==undefined && value!==null && value!=='' && !(Array.isArray(value)&&!value.length)) return value;
  }
  return null;
}
function addGroupedField(container,label,value){
  if(!isMeaningful(value)) return;
  addField(container,label,value);
}
function collectPhotoUrls(value,path='photos',out=[]){
  if(typeof value==='string' && /^https?:\/\//i.test(value) && /(photo|image|picture|url|media)/i.test(path))out.push({url:value,label:path});
  else if(Array.isArray(value))value.forEach((v,i)=>collectPhotoUrls(v,`${path}[${i}]`,out));
  else if(value && typeof value==='object')Object.entries(value).forEach(([k,v])=>collectPhotoUrls(v,`${path}.${k}`,out));
  return out;
}
function renderReviews(){
  const r=listing.reviews||{},items=Array.isArray(r.items)?r.items:[];
  $('rating-summary').innerHTML=`${starsHtml(r.average_stars||0)} &nbsp; ${Number(r.average_stars||0).toFixed(1)} / 5 · ${items.length} review${items.length===1?'':'s'}`;
  const box=$('reviews');box.replaceChildren();
  if(!items.length){box.innerHTML='<p class="muted">No reviews yet. Be the first to review this space.</p>';return;}
  items.forEach(item=>{
    const div=document.createElement('div');div.className='review';
    const n=Math.max(0,Math.min(5,Number(item.stars)||0));
    div.innerHTML=`<div>${starsHtml(n)} <strong>${n}/5</strong></div><div class="review-comment">${item.comment===null||item.comment===undefined||item.comment===''?'<span class="muted">No comment provided.</span>':escapeHtml(item.comment)}</div>${item.is_synthetic?'<div class="muted" style="font-size:11px;margin-top:5px">Demo review</div>':''}`;
    box.appendChild(div);
  });
}
function renderListing(){
  const address=listing.address||{},rates=(listing.price||{}).rates||{};
  $('title').textContent=listing.title||listing.name||`${address.district||'Dortmund space'} · ${listing.area_sqm??'—'} m²`;
  $('subtitle').textContent=[address.exact_address,address.district,address.postcode].filter(Boolean).join(' · ');
  const firstRate=Object.entries(rates).find(([k,v])=>Number.isFinite(v));
  $('price').textContent=firstRate?`${money(firstRate[1])} / ${({hour:'hour',day:'day',week:'week',month:'month'})[firstRate[0]]||firstRate[0]}`:'Price unavailable';
  const purposes=listing.purposes_allowed_or_suggested||[];
  $('summary').innerHTML=`<p>${escapeHtml(listing.description||listing.summary||'Full listing information is provided below.')}</p>${purposes.map(x=>`<span class="tag">${escapeHtml(x)}</span>`).join('')}`;
  const all=$('all-fields');all.replaceChildren();
  // Only show practical information to visitors. Hide internal IDs, data status,
  // coordinates, review aggregates, photo metadata and other implementation fields.
  addGroupedField(all,'Address',getAddress());
  addGroupedField(all,'District',address.district);
  addGroupedField(all,'Postcode',address.postcode);
  addGroupedField(all,'Area',listing.area_sqm!=null?`${listing.area_sqm} m²`:null);
  addGroupedField(all,'Capacity',listing.capacity_people!=null?`${listing.capacity_people} people`:null);

  const price=listing.price||{};
  const priceRates=price.rates||{};
  const rateLabels={hour:'Hourly',day:'Daily',week:'Weekly',month:'Monthly'};
  const priceParts=Object.entries(priceRates)
    .filter(([k,v])=>v!=='' && v!==null && v!==undefined && Number.isFinite(Number(v)) && Number(v)>0)
    .sort(([a],[b])=>['month','week','day','hour'].indexOf(a)-['month','week','day','hour'].indexOf(b))
    .map(([k,v])=>`${rateLabels[k]||formatLabel(k)}: ${money(Number(v))}`);
  addGroupedField(all,'Pricing',priceParts.length?priceParts.join('\n'):null);
  const deposit=price.deposit;
  const depositNumber=typeof deposit==='number'||(typeof deposit==='string'&&deposit.trim()!=='')?Number(deposit):NaN;
  addGroupedField(all,'Deposit',Number.isFinite(depositNumber)&&depositNumber>0?money(depositNumber):null);
  addGroupedField(all,'Price note',price.note);

  const availability=listing.availability||{};
  const days=getGroupedValue(availability,['days_of_week','days','weekdays']);
  addGroupedField(all,'Availability',getGroupedValue(availability,['status','type','availability']));
  addGroupedField(all,'Available days',days);
  addGroupedField(all,'Availability note',availability.note);

  const nearby=getGroupedValue(listing,['nearby_places','nearby','nearby_landmarks']);
  addGroupedField(all,'Nearby places',nearby);
  const transport=getGroupedValue(listing,['public_transport','public_transportation','transport']);
  addGroupedField(all,'Public transport',transport);
  addGroupedField(all,'Purpose allowed',listing.purposes_allowed_or_suggested);
  addGroupedField(all,'Facilities',listing.facilities);
  addGroupedField(all,'Condition',listing.condition);
  addGroupedField(all,'Description',listing.description||listing.summary);
  addGroupedField(all,'Contact',listing.contact);

  const photos=collectPhotoUrls(listing.photos||listing);
  const gallery=$('gallery');gallery.replaceChildren();
  const unique=[...new Map(photos.map(p=>[p.url,p])).values()];
  unique.forEach((photo,i)=>{const img=document.createElement('img');img.src=photo.url;img.alt=`Listing photo ${i+1}`;img.loading=i<2?'eager':'lazy';img.onerror=()=>img.remove();gallery.appendChild(img);});
  if(!unique.length){gallery.style.display='none';}else{gallery.style.display='grid';}
  renderReviews();
}
async function loadListing(){
  if(!spaceId){$('status').textContent='No listing ID was supplied. Return to the map and select a space.';return;}
  try{
    const res=await fetch(`/spaces/${encodeURIComponent(spaceId)}`);
    const data=await res.json();
    if(!res.ok)throw new Error(data.detail||`Could not load listing (HTTP ${res.status})`);
    listing=data;renderListing();$('status').hidden=true;$('details').hidden=false;
  }catch(err){$('status').textContent=`Could not load listing: ${err.message}. Make sure the FastAPI server is running.`;}
}
$('review-form').addEventListener('submit',async event=>{
  event.preventDefault();if(!listing)return;
  const button=$('submit-review'),status=$('review-status');
  button.disabled=true;button.textContent='Submitting…';status.className='status';status.textContent='Saving your review…';
  const comment=$('comment').value.trim();
  try{
    const res=await fetch(`/spaces/${encodeURIComponent(spaceId)}/reviews`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({stars:Number($('stars').value),comment:comment===''?null:comment})
    });
    const payload=await res.json();
    if(!res.ok)throw new Error(payload.detail||`Review failed (HTTP ${res.status})`);
    status.className='status success';status.textContent='Review added and saved successfully.';
    $('comment').value='';
    await loadListing();
  }catch(err){status.className='status error';status.textContent=err.message;}
  finally{button.disabled=false;button.textContent='Submit review';}
});
$('back').addEventListener('click',()=>{if(window.opener&&!window.opener.closed){window.close();}else{location.href='/';}});
loadListing();
</script>
